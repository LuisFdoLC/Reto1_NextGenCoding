name: CI/CD Workflow

on:
  push:
    branches:
      - develop  # Cambia esto si tu rama principal tiene otro nombre
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'  # Cambia la versión de Python según tus necesidades

      - name: Install dependencies
        run: |
          pip install -qU openai langchain langchain-openai langchain-chroma datasets tiktoken chromadb python-dotenv

      - name: Run the notebook
        run: |
          pip install nbconvert  # Instalar nbconvert para ejecutar notebooks
          jupyter nbconvert --to notebook --execute --inplace Reto1_notebook.ipynb 

      - name: Validate output files
        run: |
          if [ ! -f "output_file.txt" ]; then
            echo "Error: output_file.txt not found!"
            exit 1
          fi
          echo "Output file exists."

      - name: Test RAG functionality
        run: |
          python -c "
          from langchain.chains import RetrievalQA
          from langchain_openai import ChatOpenAI
          from langchain_chroma import Chroma
          import os

          vectorstore = Chroma(persist_directory='./chroma_db')
          llm = ChatOpenAI(model='gpt-4o-mini', api_key=os.getenv('OPENAI_API_KEY'))
          retrieval_qa = RetrievalQA(retriever=vectorstore.as_retriever(), llm=llm)
          query = '¿Cómo configurar el periférico UART en el microcontrolador RH850?'
          response = retrieval_qa({'query': query})
          if not response['result']:
              print('Error: No response generated!')
              exit(1)
          print('Test passed: Response generated successfully.')
          "

      - name: Validate execution
        run: |
          echo "Notebook executed successfully!"
